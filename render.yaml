services:
  - type: web
    name: lo-que-tarda-un-adios
    runtime: static
    buildCommand: echo "Sitio estatico listo"
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
